name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  sast_scan:
    name: Análisis Estático de Código (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Clonar código fuente
        uses: actions/checkout@v4

      - name: Ejecutar Semgrep (SAST)
        uses: semgrep/semgrep-action@v1
        # El pipeline continuará para generar el reporte completo
        continue-on-error: true
        with:
          config: p/ci

  sca_scan:
    name: Análisis de Composición / Dependencias (SCA)
    runs-on: ubuntu-latest
    steps:
      - name: Clonar código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Escaneo de Dependencias con Snyk (SCA)
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  dast_scan:
    name: Análisis Dinámico de Seguridad (DAST)
    runs-on: ubuntu-latest
    needs: [sast_scan, sca_scan]
    permissions:
      contents: read
    steps:
      - name: Clonar código fuente
        uses: actions/checkout@v4

      - name: Iniciar OWASP Juice Shop (contenedor local)
        run: |
          docker run -d --name juice-shop -p 3000:3000 bkimminich/juice-shop:latest
          timeout 180 bash -c 'until curl -sf http://localhost:3000/rest/admin/application-version; do sleep 3; done'

      - name: Escaneo DAST con OWASP ZAP (Baseline)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:3000' # Instancia local de Juice Shop
          fail_action: false
          allow_issue_writing: false
